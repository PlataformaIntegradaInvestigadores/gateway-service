events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        client_max_body_size 50m;

        set $profile_identity_backend http://profile-identity-web:8002;
        set $social_consensus_backend http://social-consensus-web:8000;
        set $search_engine_backend http://search-engine-backend:8001;
        set $search_microservice_backend http://search-microservice-backend:8002;
        set $predictive_backend http://predictive-backend:8003;
        set $rag_backend http://centinela-rag:8181;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            return 200 'ok';
        }

        location = /_auth_identity {
            internal;
            proxy_pass $profile_identity_backend/internal/auth/validate-token/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        # Identity / Auth -> profile-identity-web (backend serves /api/...)
        location /api/identity/ {
            rewrite ^/api/identity/(.*)$ /api/$1 break;
            proxy_pass $profile_identity_backend;
        }

        # Social consensus -> social-consensus-web (backend serves /api/...)
        location /api/social/ {
            rewrite ^/api/social/(.*)$ /api/$1 break;
            proxy_pass $social_consensus_backend;
        }

        # Search bridge v2 -> search-microservice-backend (backend serves /api-se/v2/...)
        location /api/search/v2/ {
            rewrite ^/api/search/v2/(.*)$ /api-se/v2/$1 break;
            proxy_pass $search_microservice_backend;
        }

        # Search engine v1 -> search-engine-backend (backend serves /api-se/...)
        location /api/search/ {
            rewrite ^/api/search/(.*)$ /api-se/$1 break;
            proxy_pass $search_engine_backend;
        }

        # Predictive -> predictive-backend (backend serves /api/v1/...)
        location /api/predictive/ {
            rewrite ^/api/predictive/(.*)$ /api/v1/$1 break;
            proxy_pass $predictive_backend;
        }

        # RAG -> centinela-rag (backend serves at root /)
        location /api/rag/ {
            rewrite ^/api/rag/(.*)$ /$1 break;
            proxy_pass $rag_backend;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # WebSocket -> social-consensus-web
        location /ws/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass $social_consensus_backend;
        }

        # Media
        location ^~ /media/profile_pictures/ {
            proxy_pass $profile_identity_backend;
        }

        location ^~ /media/ {
            proxy_pass $social_consensus_backend;
        }

        location ~* /\.(git|svn|hg|bzr)(/|$) {
            return 404;
        }

        location ~* (^|/)(CVS|\.DS_Store|\.env|\.env\..*|\.htpasswd|\.htaccess|\.bash_history|\.sh_history|\.mysql_history|\.psql_history|\.sqlite_history)$ {
            return 404;
        }

        location ~* \.(bak|backup|old|orig|save|swp|tmp|sql|sqlite|db)$ {
            return 404;
        }

        location ~* (^|/)(users|accounts|credentials|passwords|secrets|tokens)\.json$ {
            return 404;
        }
    }
}
