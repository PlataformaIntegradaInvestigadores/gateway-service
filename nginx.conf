load_module modules/ngx_http_js_module.so;

# limit_req_log_level is "warn", but nginx logs errors only from level "error" up by
# default, so rejected requests left no trace (only a 429 in the access log, without
# the zone that rejected them).
error_log /var/log/nginx/error.log warn;

events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    js_import health_aggregate from health_aggregate.js;

    # Every request reaches this gateway through the host nginx (a Docker bridge
    # address), which sends the real client address in X-Real-IP. Trust that header
    # only from the Docker networks, so the rate limits below are per client and not
    # one shared bucket for everybody.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    # Sign-in and registration: the key is empty (not limited) for any other URI.
    # $request_uri, not $uri: the location rewrites $uri to /api/... before limit_req
    # runs, so $uri would never match.
    map $request_uri $auth_limit_key {
        default "";
        ~^/api/identity/(token|companies/token|auth/mfa/verify|register|companies/register)/?(\?.*)?$ $binary_remote_addr;
    }

    limit_req_zone $auth_limit_key zone=auth:10m rate=30r/m;
    # /ask takes 1-2 minutes of CPU on the shared Ollama daemon.
    limit_req_zone $binary_remote_addr zone=heavy:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        client_max_body_size 50m;

        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 10 always;
            return 429 '{"detail":"Too many requests. Try again later."}';
        }

        set $identity_service http://identity-service:8002;
        set $social_service http://social-service:8000;
        set $search_service http://search-service:8001;
        set $search_bff_service http://search-bff-service:8002;
        set $predictive_service http://predictive-service:8003;
        set $rag_service http://rag-service:8181;
        set $governance_service http://governance-service:8005;
        set $analytics_service http://analytics-service:8006;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /health {
            return 200 'ok';
        }

        # --- Health: agregado de toda la plataforma en un solo endpoint ---
        location = /api/health {
            js_content health_aggregate.healthAll;
        }

        # --- Health: exactas, directas al /health real de cada servicio ---
        location = /api/identity/health {
            proxy_pass $identity_service/health/;
        }

        location = /api/social/health {
            proxy_pass $social_service/health/;
        }

        location = /api/search/health {
            proxy_pass $search_service/health/;
        }

        location = /api/search/v2/health {
            proxy_pass $search_bff_service/health;
        }

        location = /api/predictive/health {
            proxy_pass $predictive_service/health;
        }

        location = /api/rag/health {
            proxy_pass $rag_service/health;
        }

        location = /api/governance/health {
            proxy_pass $governance_service/health;
        }

        location = /api/analytics/health {
            proxy_pass $analytics_service/health;
        }

        # --- Docs: specs exactas, directas al upstream real de cada servicio ---
        location = /api/docs/v1/identity/openapi.json {
            proxy_pass $identity_service/api/schema/?format=json;
        }

        location = /api/docs/v1/social/openapi.json {
            proxy_pass $social_service/api/schema?format=json;
        }

        location = /api/docs/v1/search/openapi.json {
            proxy_pass $search_service/api-se/schema/?format=json;
        }

        location = /api/docs/v1/search-bff/openapi.json {
            proxy_pass $search_bff_service/openapi.json;
        }

        location = /api/docs/v1/predictive/openapi.json {
            proxy_pass $predictive_service/api/v1/openapi.json;
        }

        location = /api/docs/v1/rag/openapi.json {
            proxy_pass $rag_service/openapi.json;
        }

        # --- Docs: mismo Swagger UI estatico para los 6 servicios ---
        location ~ ^/api/docs/v1/(identity|social|search|search-bff|predictive|rag)$ {
            root /usr/share/nginx/docs;
            try_files /swagger.html =404;
        }

        # --- Docs: indice + assets estaticos del Swagger UI ---
        location = /api/docs/v1 {
            return 302 /api/docs/v1/;
        }

        location /api/docs/v1/ {
            alias /usr/share/nginx/docs/;
            index index.html;
        }

        location = /_auth_identity {
            internal;
            proxy_pass $identity_service/internal/auth/validate-token/;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Original-URI $request_uri;
        }

        # Identity / Auth -> identity-service (backend serves /api/...)
        location /api/identity/ {
            limit_req zone=auth burst=15 nodelay;
            limit_req zone=api burst=100 nodelay;
            rewrite ^/api/identity/(.*)$ /api/$1 break;
            proxy_pass $identity_service;
        }

        # Social consensus -> social-service (backend serves /api/...)
        location /api/social/ {
            limit_req zone=api burst=100 nodelay;
            rewrite ^/api/social/(.*)$ /api/$1 break;
            proxy_pass $social_service;
        }

        # Search bridge v2 -> search-bff-service (backend serves /api-se/v2/...)
        location /api/search/v2/ {
            limit_req zone=api burst=100 nodelay;
            rewrite ^/api/search/v2/(.*)$ /api-se/v2/$1 break;
            proxy_pass $search_bff_service;
        }

        # Search engine v1 -> search-service (backend serves /api-se/...)
        # Long timeout: generate-qa / use_hyde call Ollama (same daemon as rag-service).
        # Solo GET/HEAD/POST/OPTIONS: el servicio no necesita DELETE/PUT/PATCH y
        # DELETE /api-se/v1/articles/{id}/ vaciaba toda la base de Neo4j.
        location /api/search/ {
            limit_except GET POST OPTIONS {
                deny all;
            }
            limit_req zone=api burst=100 nodelay;
            rewrite ^/api/search/(.*)$ /api-se/$1 break;
            proxy_pass $search_service;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Predictive -> predictive-service (backend serves /api/v1/...)
        location /api/predictive/ {
            limit_req zone=api burst=100 nodelay;
            rewrite ^/api/predictive/(.*)$ /api/v1/$1 break;
            proxy_pass $predictive_service;
        }

        # Analytics -> analytics-service (backend serves /api/v1/...)
        location /api/analytics/ {
            limit_req zone=api burst=100 nodelay;
            rewrite ^/api/analytics/(.*)$ /api/v1/$1 break;
            proxy_pass $analytics_service;
        }

        # Governance -> governance-service (backend serves /api/v1/...)
        location /api/governance/ {
            limit_req zone=api burst=100 nodelay;
            rewrite ^/api/governance/(.*)$ /api/v1/$1 break;
            proxy_pass $governance_service;
        }

        # RAG -> rag-service (backend serves at root /)
        location /api/rag/ {
            limit_req zone=heavy burst=3 nodelay;
            limit_req zone=api burst=100 nodelay;
            rewrite ^/api/rag/(.*)$ /$1 break;
            proxy_pass $rag_service;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # WebSocket -> social-service
        location /ws/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass $social_service;
        }

        # Media
        location ^~ /media/profile_pictures/ {
            proxy_pass $identity_service;
        }

        location ^~ /media/ {
            proxy_pass $social_service;
        }

        location ~* /\.(git|svn|hg|bzr)(/|$) {
            return 404;
        }

        location ~* (^|/)(CVS|\.DS_Store|\.env|\.env\..*|\.htpasswd|\.htaccess|\.bash_history|\.sh_history|\.mysql_history|\.psql_history|\.sqlite_history)$ {
            return 404;
        }

        location ~* \.(bak|backup|old|orig|save|swp|tmp|sql|sqlite|db)$ {
            return 404;
        }

        location ~* (^|/)(users|accounts|credentials|passwords|secrets|tokens)\.json$ {
            return 404;
        }
    }
}
