# Stand-in for every backend service: answers 200 on any path, and a health payload
# that names the service by the Host the gateway used (as the real ones do).
server {
    listen 80;
    listen 8000;
    listen 8001;
    listen 8002;
    listen 8003;
    listen 8005;
    listen 8006;
    listen 8181;

    location ~ ^/health {
        default_type application/json;
        return 200 '{"server_name":"$host","global_status":"Online","groups":[{"group_name":"Service runtime","group_status":"Operativo","services":[{"name":"api","status":"ok"}]}]}';
    }

    location / {
        default_type text/plain;
        return 200 'ok';
    }
}

# ethical-recommender-service reports {status: ok, ...} without `groups`.
server {
    listen 8007;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","model":"stub","authors":1,"embedding_dim":384}';
    }

    location / {
        default_type text/plain;
        return 200 'ok';
    }
}
