name: "CD — api-gateway → Producción"

on:
  push:
    branches: [main]

jobs:
  # ── Control de calidad ────────────────────────────────────────────────────
  quality:
    name: Control de calidad (nginx config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar sintaxis de nginx.conf
        run: |
          docker run --rm -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
      - name: Validar docker-compose.yml
        run: docker compose config -q

  # ── Deploy producción ────────────────────────────────────────────────────
  deploy-production:
    name: Deploy a servidor producción
    runs-on: [self-hosted, production]
    needs: quality
    steps:
      - name: Actualizar código
        run: |
          cd /opt/centinela/gateway-service
          git fetch origin main
          git reset --hard origin/main

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela/gateway-service
          docker compose up -d --build --remove-orphans

      - name: Health check con rollback automático
        run: |
          sleep 5
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback al commit anterior"
            cd /opt/centinela/gateway-service && git reset --hard HEAD~1
            docker compose up -d --build --remove-orphans
            exit 1
          fi
          echo "Deploy exitoso — api-gateway en producción"
