name: CI — api-gateway

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  branch-name:
    name: Validar nombre de rama
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verificar prefijo (feature/*, hotfix/*, chore/*)
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in
            feature/*|hotfix/*|chore/*) echo "OK: $BRANCH"; exit 0 ;;
            *) echo "Rama '$BRANCH' no cumple convención (feature/*, hotfix/*, chore/*)"; exit 1 ;;
          esac

  quality:
    name: Quality gate (nginx config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis de nginx.conf
        run: |
          docker run --rm -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
      - name: Validar docker-compose.yml
        run: docker compose config -q

  deploy-staging:
    name: Deploy a servidor staging
    runs-on: [self-hosted, staging]
    needs: quality
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Actualizar codigo
        run: |
          cd /opt/centinela/api-gateway
          git fetch origin develop
          git reset --hard origin/develop
      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela/api-gateway
          docker compose up -d --build
      - name: Health check
        run: |
          sleep 5
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback"
            cd /opt/centinela/api-gateway && git reset --hard HEAD~1
            docker compose up -d --build
            exit 1
          fi
